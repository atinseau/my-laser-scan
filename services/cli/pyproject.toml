[project]
name = "road2track-cli"
version = "0.1.0"
description = "CLI dev/admin — point d'entrée 'uv run road2track ...'"
requires-python = ">=3.11"
dependencies = [
    "road2track-pipeline",
    "typer>=0.12",
]

[project.scripts]
road2track = "road2track_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road2track_cli"]

[tool.uv.sources]
road2track-pipeline = { workspace = true }
