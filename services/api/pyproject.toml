[project]
name = "road2track-api"
version = "0.1.0"
description = "API HTTP FastAPI — exposée sur Tailscale (V1+, cf. specs/01-cahier-des-charges.md §3.2)"
requires-python = ">=3.11"
dependencies = [
    "road2track-pipeline",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
road2track-pipeline = { workspace = true }
