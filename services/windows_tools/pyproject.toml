[project]
name = "road2track-windows-tools"
version = "0.1.0"
description = "Worker Temporal sur queue 'windows-tools' — compile KN5 via ksEditor.exe"
requires-python = ">=3.11"
dependencies = [
    "road2track-pipeline",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
road2track-pipeline = { workspace = true }
