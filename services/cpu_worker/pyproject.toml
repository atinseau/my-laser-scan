[project]
name = "road2track-cpu-worker"
version = "0.1.0"
description = "Worker Temporal sur queue 'cpu' — exécute les activités CPU sur la machine d'orchestration"
requires-python = ">=3.11"
dependencies = [
    "road2track-pipeline",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
road2track-pipeline = { workspace = true }
