[project]
name = "road2track-cloud-bridge"
version = "0.1.0"
description = "Adapter spillover GPU — providers RunPod / vast.ai / LocalDesktop, cycle de vie des workers (cf. specs/02-architecture.md §4.6)"
requires-python = ">=3.11"
dependencies = [
    "road2track-core",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road2track_cloud_bridge"]

[tool.uv.sources]
road2track-core = { workspace = true }
