[project]
name = "road2track-geo"
version = "0.1.0"
description = "Calculs géo purs — fusion capteurs (EKF), projections, détection circuit, tuilage (cf. specs/02-architecture.md §4.2)"
requires-python = ">=3.11"
dependencies = [
    "road2track-core",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyproj>=3.6",
]

[project.optional-dependencies]
heavy = [
    "open3d>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road2track_geo"]

[tool.uv.sources]
road2track-core = { workspace = true }
