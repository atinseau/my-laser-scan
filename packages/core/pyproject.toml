[project]
name = "road2track-core"
version = "0.1.0"
description = "Domaine pur — entités, value objects, ports, événements (cf. specs/02-architecture.md §4.1)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road2track_core"]
