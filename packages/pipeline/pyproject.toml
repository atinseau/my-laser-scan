[project]
name = "road2track-pipeline"
version = "0.1.0"
description = "Cœur applicatif — workflows et activities Temporal (cf. specs/02-architecture.md §4.7)"
requires-python = ">=3.11"
dependencies = [
    "road2track-core",
    "road2track-geo",
    "road2track-ml",
    "road2track-storage",
    "road2track-ac-export",
    "road2track-cloud-bridge",
    "temporalio>=1.7.0",
    "structlog>=24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road2track_pipeline"]

[tool.uv.sources]
road2track-core = { workspace = true }
road2track-geo = { workspace = true }
road2track-ml = { workspace = true }
road2track-storage = { workspace = true }
road2track-ac-export = { workspace = true }
road2track-cloud-bridge = { workspace = true }
