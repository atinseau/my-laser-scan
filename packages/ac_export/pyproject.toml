[project]
name = "road2track-ac-export"
version = "0.1.0"
description = "Génération de track Assetto Corsa — KN5, .ini, AI line, packaging Content Manager (cf. specs/02-architecture.md §4.5)"
requires-python = ">=3.11"
dependencies = [
    "road2track-core",
    "road2track-geo",
    "jinja2>=3.1",
    "pillow>=10.0",
]

# Blender bpy en extra car lourd et plateforme-spécifique.
[project.optional-dependencies]
blender = [
    "bpy>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/road2track_ac_export"]

[tool.uv.sources]
road2track-core = { workspace = true }
road2track-geo = { workspace = true }
