line-length = 100
target-version = "py312"

[lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # naming (PEP 8)
    "UP",             # pyupgrade
    "ANN",            # annotations
    "B",              # bugbear
    "A",              # builtin shadowing
    "C4",             # comprehensions
    "T20",            # print statements
    "PT",             # pytest style
    "Q",              # quotes
    "RET",            # returns
    "SIM",            # simplify
    "ARG",            # unused args
    "PTH",            # pathlib
]
ignore = [
    # Le projet vise 3.11+ (cf. specs/03-stack-technique.md). Le `type X = Y` (PEP 695)
    # n'est dispo qu'à partir de 3.12, donc on garde TypeAlias pour la compat.
    "UP040",
]

[lint.per-file-ignores]
"tests/**" = ["ANN", "ARG"]
"scripts/**" = ["T20"]
# Le module GS enveloppe torch + gsplat (non typés et non installés en CI
# CPU-only via l'extra `gs`). On accepte `Any` aux signatures internes ; la
# frontière typée reste l'API publique de `road2track_ml.gs.__init__`.
"packages/ml/src/road2track_ml/gs/**" = ["ANN401"]

[format]
quote-style = "double"
indent-style = "space"
